name: Test Kconfig recursion detection

on: [push]

jobs:
  test-kconfig:
    name: Defconfig recursion check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout openwrt main
        uses: actions/checkout@v7
        with:
          repository: openwrt/openwrt
          path: openwrt
          fetch-depth: 1

      - name: Checkout PR branch packages
        uses: actions/checkout@v7
        with:
          path: packages
          fetch-depth: 1

      - name: Apply generator fix if the branch carries the patch
        working-directory: openwrt
        run: |
          PATCH="$GITHUB_WORKSPACE/.github/patches/pkgmeta-archfix.patch"
          if [ -f "$PATCH" ]; then
            git apply "$PATCH"
            echo "RESULT: applied pkgmeta-archfix.patch"
          else
            echo "RESULT: no fix patch (baseline)"
          fi

      - name: Run make defconfig (full log)
        working-directory: openwrt
        run: |
          sed -i '/^src-git\(-full\)\? packages/d' feeds.conf.default
          echo "src-link packages $GITHUB_WORKSPACE/packages" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -f -a
          rm -rf tmp/info tmp/.packageinfo tmp/.config-package.in
          echo "CONFIG_ALL=y" >> .config
          echo "CONFIG_TARGET_x86_64=y" >> .config
          make defconfig 2>&1 | tee /tmp/defconfig.log
          if grep -q "recursive dependency" /tmp/defconfig.log; then
            echo "RESULT: recursive dependency detected"
            exit 1
          fi
          echo "RESULT: no recursion"